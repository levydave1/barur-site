name: Transcribe videos (word timestamps)

# Claude adds a file name (without .mp4) per line to social/heygen/transcribe.txt.
# This workflow transcribes social/heygen/raw/<name>.mp4 (or social/video/<name>.mp4)
# with a Hebrew Whisper model and writes word-level timestamps to
# social/heygen/words/<name>.json, so captions and animation can follow the speech.

on:
  push:
    paths:
      - 'social/heygen/transcribe.txt'
  workflow_dispatch: {}

concurrency:
  group: transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper
      - name: Transcribe queued files
        run: |
          mkdir -p social/heygen/words
          touch social/heygen/transcribe.txt
          python - <<'PY'
          import json, os
          from faster_whisper import WhisperModel
          names=[l.strip() for l in open('social/heygen/transcribe.txt',encoding='utf-8') if l.strip() and not l.startswith('#')]
          todo=[]
          for n in names:
              out=f'social/heygen/words/{n}.json'
              if os.path.exists(out): continue
              for src in (f'social/heygen/raw/{n}.mp4', f'social/video/{n}.mp4'):
                  if os.path.exists(src): todo.append((n,src,out)); break
              else: print('::warning::missing source for', n)
          if not todo: print('nothing to do'); raise SystemExit
          m=WhisperModel('ivrit-ai/whisper-large-v3-turbo-ct2', device='cpu', compute_type='int8')
          for n,src,out in todo:
              segs,info=m.transcribe(src, language='he', word_timestamps=True, beam_size=5, vad_filter=False)
              words=[]; text=[]
              for s in segs:
                  text.append(s.text)
                  for w in (s.words or []):
                      words.append({'w':w.word.strip(),'s':round(w.start,3),'e':round(w.end,3),'p':round(w.probability,3)})
              json.dump({'text':' '.join(t.strip() for t in text),'words':words}, open(out,'w',encoding='utf-8'), ensure_ascii=False, indent=0)
              print(n, len(words), 'words')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social/heygen/words
          if git diff --cached --quiet; then echo "Nothing new"; else
            git commit -m "chore: add word timestamps"
            git pull --rebase
            git push
          fi
